site_name: QWIM Dashboard Documentation
site_description: Comprehensive documentation for the QWIM Dashboard time series analysis tool
site_author: QWIM Development Team
site_url: https://your-domain.com/qwim-dashboard

# Repository
repo_name: dashboard-QWIM
repo_url: https://github.com/your-org/dashboard-QWIM
edit_uri: edit/main/docs/

# Configuration
theme:
  name: material
  language: en
  palette:
    # Palette toggle for light mode
    - scheme: default
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Palette toggle for dark mode
    - scheme: slate
      primary: blue
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - announce.dismiss
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - content.tooltips
    - header.autohide
    - navigation.expand
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.prune
    - navigation.sections
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.share
    - search.suggest
    - toc.follow
    - toc.integrate

# Plugins
plugins:
  - search:
      separator: '[\s\-,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
  - minify:
      minify_html: true
  - gen-files:
      scripts:
        - docs/gen_ref_pages.py
  - literate-nav:
      nav_file: SUMMARY.md
  - section-index
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: google
            show_source: true
            show_root_heading: true
            show_signature_annotations: true

# Customization
extra:
  analytics:
    provider: google
    property: !ENV GOOGLE_ANALYTICS_KEY
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/your-org/dashboard-QWIM
    - icon: fontawesome/brands/python
      link: https://www.python.org/
  version:
    provider: mike

# Extensions
markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      emoji_index: !!python/name:material.extensions.emoji.twemoji
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.magiclink:
      normalize_issue_symbols: true
      repo_url_shorthand: true
      user: your-org
      repo: dashboard-QWIM
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.snippets:
      check_paths: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
      combine_header_slug: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Quick Start: getting-started/quickstart.md
    - Configuration: getting-started/configuration.md
  - User Guide:
    - Dashboard Overview: user-guide/overview.md
    - Overview of Tab Portfolios: user-guide/tab-portfolios.md
    - Overview of Tab Investors: user-guide/tab-investors.md
    - Data Filtering: user-guide/data-filtering.md
    - Export Features: user-guide/export.md
  - Reference:
    - Overview: reference/index.md
    - Dashboard Main: reference/dashboard/main_App.md
    - Portfolios:
      - Overview: reference/dashboard/modules_tab_portfolios/tab_portfolios.md
      - Portfolio Analysis: reference/dashboard/modules_tab_portfolios/subtab_portfolios_analysis.md
      - Portfolio Comparison: reference/dashboard/modules_tab_portfolios/subtab_portfolios_comparison.md
      - Weights Distribution: reference/dashboard/modules_tab_portfolios/subtab_weights_distribution.md
    - Tab Investors:
      - Overview: reference/dashboard/modules_tab_investors/tab_investors.md
      - Personal Information: reference/dashboard/modules_tab_investors/subtab_investors_personal_info.md
      - Assets: reference/dashboard/modules_tab_investors/subtab_investors_assets.md
      - Goals: reference/dashboard/modules_tab_investors/subtab_investors_goals.md
      - Income: reference/dashboard/modules_tab_investors/subtab_investors_income.md
  - Development:
    - Contributing: development/contributing.md
    - Code Standards: development/standards.md
    - Testing: development/testing.md
  - Deployment:
    - Local Development: deployment/local.md
    - Production: deployment/production.md
    - Docker: deployment/docker.md
