[tool:pytest]
minversion = 7.0
addopts = 
    -ra
    -q
    --ignore=tests/shiny_tests/*.py
    --strict-markers
    --strict-config
    --cov=src
    --cov-branch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --html=reports/pytest_report.html
    --self-contained-html
    --junitxml=reports/junit.xml
    --tb=short
testpaths = 
    tests
python_files = 
    test_*.py
    *_test.py
python_classes = 
    Test*
python_functions = 
    test_*
collect_ignore = []
norecursedirs = 
    .git
    .tox
    dist
    build
    *.egg
    __pycache__
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    data: marks tests as data validation tests
    ui: marks tests as UI/frontend tests
    api: marks tests as API tests
    defensive: marks tests for defensive programming validation
    e2e: marks tests as end-to-end tests
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning